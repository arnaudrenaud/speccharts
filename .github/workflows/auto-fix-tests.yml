name: "Auto-fix failing tests in Renovate PRs"

on:
  workflow_run:
    workflows:
      - "Build and test always, publish on tag"
    types:
      - completed
    branches:
      - "renovate/**"

concurrency:
  group: auto-fix-tests-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  auto-fix-tests:
    name: Fix PR failing tests
    if: github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest

    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.AUTO_FIX_APP_ID }}
          private-key: ${{ secrets.AUTO_FIX_APP_PRIVATE_KEY }}

      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Auto-fix failing tests
        uses: ./.github/actions/auto-fix-with-agent
        with:
          success-test: npm run build-and-test
          failed-workflow-run-id: ${{ github.event.workflow_run.id }}
          work-branch: ${{ github.event.workflow_run.head_branch }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          task-description: >-
            Fix the failed test run, probably because of a breaking change in a dependency update.
            Do not delete or disable tests unless a test is obsolete because of this change, and explain why.
          commit-title: "fix(auto): Auto-fix tests following dependency breaking change"
          agent-install-command: npm install -g @anthropic-ai/claude-code
          agent-command: |
            claude \
              -p "$(cat "$AGENT_PROMPT_PATH")" \
              --permission-mode bypassPermissions \
              --max-budget-usd 2.00 \
              --output-format json
          agent-env: |
            CLAUDE_CODE_OAUTH_TOKEN=${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
