name: "Auto-fix with Agent"
description: "Runs an AI coding agent against a task, verifies the result with a command, and commits/pushes/reports the outcome."
author: "arnaudrenaud"

inputs:
  success-check:
    description: "Shell command to test the agent's work, of which exit code 0 means success."
    required: true
  failed-workflow-run-id:
    description: "ID of the completed, failing workflow run whose output should be fed to the agent."
    required: true
  branch:
    description: "Branch to push the fix to and to comment on (typically the PR branch)."
    required: true
  github-token:
    description: "Token used to read the failed run output and to comment on the PR. Needs `actions: read` and `pull-requests: write`."
    required: true
  task-description:
    description: "One or two sentences telling the agent what it should do."
    required: false
    default: "Complete the requested task."
  max-attempts:
    description: "How many times the agent may retry running the success check command before giving up."
    required: false
    default: "3"
  agent-install-command:
    description: "Shell command that installs the agent CLI referenced by agent-command."
    required: true
  agent-command:
    description: >
      Shell command to invoke the agent. The prompt is provided on the command's
      stdin — let the agent read it natively from stdin
      (e.g. flag `-p` for Claude, or natively for Codex or Gemini).
      Its stdout must be JSON with `.result` and `.total_cost_usd` fields.
    required: true
  agent-env:
    description: "Extra environment variables the agent command needs, one KEY=VALUE per line (e.g. an auth token secret)."
    required: true
  agent-timeout-minutes:
    description: "Kill the agent command if it runs longer than this many minutes."
    required: false
    default: "30"
  commit-title:
    description: "Subject line of the commit created when the agent produces changes."
    required: false
    default: "chore: Apply agent changes"
  git-user-name:
    required: false
    default: "github-actions[bot]"
  git-user-email:
    required: false
    default: "github-actions[bot]@users.noreply.github.com"
  run-no-more-than-once-ever-for-branch:
    description: >
      If "true", runs the real logic at most once per (branch, success-check)
      pair — later invocations become no-ops. A bad fix from the agent isn't itself
      dangerous (success-check just keeps failing), but if a caller workflow
      re-triggers this action on every such failure, that's an unbounded loop;
      enable this when that's necessary given how the caller is wired up.
    required: false
    default: "false"

outputs:
  has-changes:
    description: '"true" if the agent produced changes that were committed and pushed.'
    value: ${{ steps.changes.outputs.has_changes }}

runs:
  using: "composite"
  steps:
    - name: Compute guard cache key
      if: inputs.run-no-more-than-once-ever-for-branch == 'true'
      id: guard-key
      shell: bash
      run: |
        HASH=$(printf '%s' "${{ inputs.success-check }}" | sha256sum | cut -c1-16)
        echo "key=auto-fix-with-agent-once-${{ inputs.branch }}-$HASH" >> "$GITHUB_OUTPUT"

    - name: Check for a prior claim on this branch + check
      if: inputs.run-no-more-than-once-ever-for-branch == 'true'
      id: guard-cache
      uses: actions/cache/restore@v4
      with:
        path: guard-marker
        key: ${{ steps.guard-key.outputs.key }}
        lookup-only: true

    - name: Decide whether to proceed
      id: guard
      shell: bash
      run: echo "proceed=${{ inputs.run-no-more-than-once-ever-for-branch != 'true' || steps.guard-cache.outputs.cache-hit != 'true' }}" >> "$GITHUB_OUTPUT"

    # Claimed immediately, before any real work, so a crash or timeout further down
    # can't leave this branch unclaimed and open to retrying forever.
    - name: Claim this branch + check
      if: inputs.run-no-more-than-once-ever-for-branch == 'true' && steps.guard.outputs.proceed == 'true'
      shell: bash
      run: echo claimed > guard-marker

    - name: Persist the claim
      if: inputs.run-no-more-than-once-ever-for-branch == 'true' && steps.guard.outputs.proceed == 'true'
      uses: actions/cache/save@v4
      with:
        path: guard-marker
        key: ${{ steps.guard-key.outputs.key }}

    - name: Configure Git
      if: steps.guard.outputs.proceed == 'true'
      shell: bash
      run: |
        git config --global user.name "${{ inputs.git-user-name }}"
        git config --global user.email "${{ inputs.git-user-email }}"

    - name: Install agent
      if: steps.guard.outputs.proceed == 'true'
      shell: bash
      run: ${{ inputs.agent-install-command }}

    - name: Extract failed workflow logs
      if: steps.guard.outputs.proceed == 'true'
      id: failed-workflow-logs
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        FAILED_LOGS_PATH="${RUNNER_TEMP}/auto-fix-with-agent-failed-workflow-logs.txt"
        gh run view "${{ inputs.failed-workflow-run-id }}" --log-failed > "$FAILED_LOGS_PATH"
        echo "path=$FAILED_LOGS_PATH" >> "$GITHUB_OUTPUT"

    - name: Run agent
      if: steps.guard.outputs.proceed == 'true'
      id: agent
      shell: bash
      env:
        FAILED_LOGS_PATH: ${{ steps.failed-workflow-logs.outputs.path }}
      run: |
        AGENT_REPORT_PATH="${RUNNER_TEMP}/auto-fix-with-agent-report.md"
        echo "agent_report_path=$AGENT_REPORT_PATH" >> "$GITHUB_OUTPUT"

        AGENT_PROMPT_PATH="${RUNNER_TEMP}/auto-fix-with-agent-prompt.md"
        cat > "$AGENT_PROMPT_PATH" <<PROMPT
        ${{ inputs.task-description }}

        Constraints:
        - Do not commit or push changes; the workflow will do it after task completion.
        - Do not read, print, modify, or exfiltrate secrets, tokens, or credentials.
        - Avoid hacks, prefer a durable fix.
        - After changes have been applied to the working directory (not committed), run \`${{ inputs.success-check }}\`: this counts as one attempt.
        - If no solution has been found after ${{ inputs.max-attempts }} attempts, stop and revert any changes in the working directory.
        - At the end, whatever the outcome, write a concise Markdown report to \`$AGENT_REPORT_PATH\` with exactly these sections: \`### Obstacles encountered\` and \`### Decisions taken\`. If no solution has been found, leave the "Decisions taken" empty, only with a "—".

        Failed workflow run logs:

        \`\`\`text
        $(cat "$FAILED_LOGS_PATH")
        \`\`\`
        PROMPT

        export AGENT_OUTPUT_PATH="${RUNNER_TEMP}/auto-fix-with-agent-output.json"
        export AGENT_STDERR_PATH="${RUNNER_TEMP}/auto-fix-with-agent-stderr.log"

        while IFS= read -r line; do
          [ -z "$line" ] && continue
          export "${line%%=*}=${line#*=}"
        done <<< "${{ inputs.agent-env }}"

        AGENT_COMMAND_SCRIPT="${RUNNER_TEMP}/auto-fix-with-agent-command.sh"
        cat > "$AGENT_COMMAND_SCRIPT" <<'AGENT_COMMAND_EOF'
        ${{ inputs.agent-command }}
        AGENT_COMMAND_EOF

        TIMEOUT_CMD=()
        if command -v timeout >/dev/null 2>&1; then
          TIMEOUT_CMD=(timeout "${{ inputs.agent-timeout-minutes }}m")
        fi

        set +e
        "${TIMEOUT_CMD[@]}" bash "$AGENT_COMMAND_SCRIPT" < "$AGENT_PROMPT_PATH" > "$AGENT_OUTPUT_PATH" 2> "$AGENT_STDERR_PATH"
        AGENT_EXIT_CODE=$?
        set -e

        if [ "$AGENT_EXIT_CODE" -ne 0 ]; then
          echo "::error::Agent exited with code $AGENT_EXIT_CODE"
          cat "$AGENT_STDERR_PATH" >&2 || true
        fi

        jq -r '.result // empty' "$AGENT_OUTPUT_PATH" 2>/dev/null || true
        if [ -s "$AGENT_OUTPUT_PATH" ]; then
          AGENT_COST=$(jq -r '.total_cost_usd // "unknown"' "$AGENT_OUTPUT_PATH" 2>/dev/null || echo unknown)
        else
          AGENT_COST="unknown"
        fi
        echo "Agent cost (USD): $AGENT_COST"

        exit "$AGENT_EXIT_CODE"

    - name: Check whether the agent changed files
      if: steps.guard.outputs.proceed == 'true'
      id: changes
      shell: bash
      run: |
        git add .

        if git diff --cached --quiet; then
          echo "No changes to commit."
          echo "has_changes=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        echo "has_changes=true" >> "$GITHUB_OUTPUT"

    - name: Stop if success check still fails
      if: steps.guard.outputs.proceed == 'true' && steps.changes.outputs.has_changes == 'true'
      shell: bash
      run: ${{ inputs.success-check }}

    - name: Commit and push changes, if any
      if: steps.guard.outputs.proceed == 'true' && steps.changes.outputs.has_changes == 'true'
      shell: bash
      env:
        AGENT_REPORT_PATH: ${{ steps.agent.outputs.agent_report_path }}
      run: |
        AGENT_REPORT=$([ -s "$AGENT_REPORT_PATH" ] && cat "$AGENT_REPORT_PATH" || echo "No agent report was found.")

        git commit \
          -m "${{ inputs.commit-title }}" \
          -m "$AGENT_REPORT"
        git push origin "HEAD:refs/heads/${{ inputs.branch }}" --force --no-verify

    - name: Whatever the outcome, post report as a comment to pull request
      # Runs whatever the outcome of the agent work, except if the job was
      # cancelled or the guard blocked this run (nothing happened, nothing to report).
      if: ${{ steps.guard.outputs.proceed == 'true' && !cancelled() }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        AGENT_REPORT_PATH: ${{ steps.agent.outputs.agent_report_path }}
      run: |
        AGENT_REPORT=$([ -s "$AGENT_REPORT_PATH" ] && cat "$AGENT_REPORT_PATH" || echo "No agent report was found.")

        COMMENT_BODY=$(cat <<COMMENT
        ## Agent run report
        <!-- auto-fix-with-agent-report -->

        $AGENT_REPORT
        COMMENT
        )

        gh pr comment "${{ inputs.branch }}" --repo "$GITHUB_REPOSITORY" --body "$COMMENT_BODY"
